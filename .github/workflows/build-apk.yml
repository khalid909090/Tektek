name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # Java 17
      # ==========================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # Check Java
      # ==========================================

      - name: Check Java
        run: |
          java -version
          javac -version


      # ==========================================
      # System packages
      # ==========================================

      - name: Install system packages
        run: |

          sudo apt update

          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev


      # ==========================================
      # Python packages
      # ==========================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          pip install buildozer

          pip install cython


      # ==========================================
      # Accept Android licenses
      # ==========================================

      - name: Accept Android SDK licenses
        run: |

          mkdir -p $HOME/.android

          yes | sdkmanager --licenses || true


      # ==========================================
      # Build APK
      # ==========================================

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |

          yes | buildozer -v android debug


      # ==========================================
      # Upload APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:

          name: TikTok-Downloader-APK

          path: bin/*.apk
